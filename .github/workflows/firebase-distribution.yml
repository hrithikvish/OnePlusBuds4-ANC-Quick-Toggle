name: Release on Firebase App Distribution

on:
  workflow_dispatch:

jobs:
  build:
    name: Release on Firebase Distribution
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >
        -Xmx6g
        -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release notes from commit message
        run: |
          git log -1 --pretty=%B "$GITHUB_SHA" > release_notes.txt
          echo "Release notes:"
          cat release_notes.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: |
          ./gradlew :app:assembleRelease \
            --build-cache \
            --parallel \
            --no-daemon

      - name: Upload arm64-v8a Release APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:1017336057532:android:b488004ee3380ce7d44ab9"
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: internal
          file: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          releaseNotesFile: release_notes.txt
